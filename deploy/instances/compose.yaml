# Pile d'une instance cliente (<client>.quinou.fr), derrière Traefik. Même fichier pour tous les clients :
# seuls stack.env (Compose), app.env (application) et mercure.env changent. Écrits par provision.sh.
#
# Différences avec deploy/compose.yaml (staging et production de l'application seule) :
#   - pas de service database : la base du client est sur le serveur PostgreSQL commun (socle.compose.yaml) ;
#   - pas d'authentification de recette ni de page de maintenance.
#
# Réseaux : backend est propre à l'instance. Seul php rejoint le réseau des bases, seuls web et mercure
# rejoignent celui de Traefik. Les conteneurs php des différents clients partagent donc le réseau des bases :
# ils se voient entre eux sur le port de PHP-FPM, mais chaque base n'accepte que le rôle de son client.

x-logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
    php:
        image: ${PHP_IMAGE:?PHP_IMAGE manquant}
        restart: unless-stopped
        cpus: ${APP_CPUS:-0.5}
        mem_limit: ${APP_MEMORY:-384m}
        env_file: app.env
        volumes:
            - sessions:/srv/app/var/sessions
        networks: [backend, db]
        logging: *logging

    web:
        image: ${WEB_IMAGE:?WEB_IMAGE manquant}
        restart: unless-stopped
        environment:
            AUTH_BASIC: "off"
        networks: [backend, proxy]
        depends_on: [php]
        labels:
            - traefik.enable=true
            - traefik.docker.network=${TRAEFIK_NETWORK:?required}
            - traefik.http.routers.${COMPOSE_PROJECT_NAME:?required}.rule=Host(`${APP_HOST:?required}`)
            - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=${TRAEFIK_ENTRYPOINT:?required}
            - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true
            - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${TRAEFIK_CERTRESOLVER:?required}
            - traefik.http.routers.${COMPOSE_PROJECT_NAME}.service=${COMPOSE_PROJECT_NAME}
            - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80
        logging: *logging

    # Hub temps réel de l'instance, servi sur le même hôte sous /.well-known/mercure.
    mercure:
        image: dunglas/mercure:v0.16
        restart: unless-stopped
        env_file: mercure.env
        environment:
            SERVER_NAME: ":80"
        volumes: ["mercure_data:/data", "mercure_config:/config"]
        networks: [backend, proxy]
        labels:
            - traefik.enable=true
            - traefik.docker.network=${TRAEFIK_NETWORK:?required}
            - traefik.http.routers.${COMPOSE_PROJECT_NAME:?required}-mercure.rule=Host(`${APP_HOST:?required}`) && PathPrefix(`/.well-known/mercure`)
            - traefik.http.routers.${COMPOSE_PROJECT_NAME}-mercure.entrypoints=${TRAEFIK_ENTRYPOINT:?required}
            - traefik.http.routers.${COMPOSE_PROJECT_NAME}-mercure.tls=true
            - traefik.http.routers.${COMPOSE_PROJECT_NAME}-mercure.tls.certresolver=${TRAEFIK_CERTRESOLVER:?required}
            - traefik.http.routers.${COMPOSE_PROJECT_NAME}-mercure.service=${COMPOSE_PROJECT_NAME}-mercure
            - traefik.http.services.${COMPOSE_PROJECT_NAME}-mercure.loadbalancer.server.port=80
        logging: *logging

networks:
    backend: {}
    db:
        external: true
        name: ${DB_NETWORK:?required}
    proxy:
        external: true
        name: ${TRAEFIK_NETWORK}

volumes:
    sessions: {}
    mercure_data: {}
    mercure_config: {}
