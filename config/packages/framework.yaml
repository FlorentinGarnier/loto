# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true
    csrf_protection: true

    #esi: true
    #fragments: true

    # Le client HTTP ne sert qu'à publier vers le hub Mercure, sur le même hôte.
    # Sans limite, un hub qui ne répond plus bloquerait chaque tirage une minute :
    # on abandonne la publication au bout de 3 secondes, l'écran de salle se
    # resynchronise ensuite seul (/public/state).
    http_client:
        default_options:
            timeout: 2
            max_duration: 3

when@prod:
    framework:
        # Derrière Traefik puis Nginx : adresse du client et HTTPS lus dans les en-têtes transmis.
        trusted_proxies: '%env(TRUSTED_PROXIES)%'
        trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-host', 'x-forwarded-port']
        session:
            # Volume « sessions » du déploiement : l'animateur reste connecté après une mise en production.
            save_path: '%kernel.project_dir%/var/sessions'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
