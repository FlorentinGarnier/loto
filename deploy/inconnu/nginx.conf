# Répond 404 avec la page de deploy/inconnu/public à toute adresse : ce conteneur ne reçoit que les
# sous-domaines de quinou.fr qui ne correspondent à aucune instance (voir compose.yaml).
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Une instance créée plus tard doit répondre tout de suite : rien n'est gardé en cache, rien n'est indexé.
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex" always;

    error_page 404 /index.html;
    location = /index.html { internal; }
    location / { return 404; }
}
